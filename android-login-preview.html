<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Login Page Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .phone-frame {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background: #FAFAFA;
            border-radius: 30px;
            overflow-y: auto;
            padding: 24px;
        }
        
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }
        
        .logo svg {
            width: 60px;
            height: 60px;
            fill: white;
        }
        
        .welcome-text {
            font-size: 28px;
            font-weight: bold;
            color: #212121;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #757575;
            margin-bottom: 40px;
        }
        
        .input-group {
            width: 100%;
            margin-bottom: 16px;
        }
        
        .input-wrapper {
            position: relative;
            width: 100%;
        }
        
        .input-field {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            font-size: 16px;
            color: #212121;
            background: white;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #757575;
        }
        
        .input-label {
            position: absolute;
            left: 48px;
            top: -10px;
            background: white;
            padding: 0 4px;
            font-size: 12px;
            color: #667eea;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 32px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #757575;
        }
        
        .remember-me input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }
        
        .forgot-password {
            font-size: 14px;
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        
        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
            margin-bottom: 24px;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }
        
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #E0E0E0;
        }
        
        .divider-text {
            padding: 0 16px;
            font-size: 14px;
            color: #757575;
        }
        
        .social-buttons {
            display: flex;
            gap: 16px;
            width: 100%;
            margin-bottom: 24px;
        }
        
        .social-button {
            flex: 1;
            padding: 14px;
            background: white;
            border: 1px solid #E0E0E0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            color: #212121;
        }
        
        .social-button:hover {
            border-color: #667eea;
            background: #F5F5F5;
        }
        
        .social-icon {
            width: 20px;
            height: 20px;
        }
        
        .signup-text {
            text-align: center;
            font-size: 14px;
            color: #757575;
        }
        
        .signup-link {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }
        
        .screen::-webkit-scrollbar {
            width: 4px;
        }
        
        .screen::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .screen::-webkit-scrollbar-thumb {
            background: #E0E0E0;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="screen">
            <div class="login-container">
                <!-- Logo -->
                <div class="logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                
                <!-- Welcome Text -->
                <div class="welcome-text">Welcome Back</div>
                <div class="subtitle">Sign in to continue</div>
                
                <!-- Email Input -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-label">Email</span>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                        </svg>
                        <input type="email" class="input-field" placeholder="Enter your email">
                    </div>
                </div>
                
                <!-- Password Input -->
                <div class="input-group">
                    <div class="input-wrapper">
                        <span class="input-label">Password</span>
                        <svg class="input-icon" viewBox="0 0 24 24">
                            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                        </svg>
                        <input type="password" class="input-field" placeholder="Enter your password">
                    </div>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a class="forgot-password">Forgot Password?</a>
                </div>
                
                <!-- Login Button -->
                <button class="login-button">LOGIN</button>
                
                <!-- Divider -->
                <div class="divider">
                    <div class="divider-line"></div>
                    <span class="divider-text">OR</span>
                    <div class="divider-line"></div>
                </div>
                
                <!-- Social Login Buttons -->
                <div class="social-buttons">
                    <button class="social-button">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Google
                    </button>
                    <button class="social-button">
                        <svg class="social-icon" viewBox="0 0 24 24">
                            <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        Facebook
                    </button>
                </div>
                
                <!-- Sign Up Link -->
                <div class="signup-text">
                    Don't have an account? <a class="signup-link">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
